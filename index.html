<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - PPLG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1115; 
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header-chat {
            background-color: #1e2329;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .header-chat .time {
            font-size: 12px;
            color: #8b939c;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }

        .menu-item {
            background-color: #1a1e24; 
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c323a; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }

        .menu-item:hover, .menu-item:active {
            background-color: #2c323a;
        }

        .menu-item span {
            margin-right: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header-chat">
            <span>Pilih menu di bawah</span>

        </div>
